<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Running Math 2026 - Phiếu Điểm Trạm 2</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&display=swap');

        body {
            font-family: 'Fira Code', monospace;
            background-color: #020617; /* Dark slate */
            color: #22d3ee; /* Cyan */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            background-image: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
        }

        .container {
            background-color: rgba(15, 23, 42, 0.9);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.15);
            border: 1px solid #0891b2;
            width: 100%;
            max-width: 550px;
            position: relative;
            overflow: hidden;
        }

        /* Scanline effect for digital vibe */
        .container::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
            opacity: 0.3;
        }

        h1 {
            color: #67e8f9;
            font-size: 26px;
            margin-bottom: 5px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(103, 232, 249, 0.5);
        }

        h2 {
            color: #94a3b8;
            font-size: 16px;
            font-weight: normal;
            margin-top: 0;
            margin-bottom: 25px;
            text-align: center;
            letter-spacing: 1px;
        }

        .instructions {
            text-align: left;
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 25px;
            background-color: rgba(0, 0, 0, 0.4);
            padding: 12px 15px;
            border-radius: 6px;
            border-left: 4px solid #0ea5e9;
            line-height: 1.5;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            z-index: 10;
        }

        label {
            font-weight: 600;
            color: #38bdf8;
            width: 40%;
            font-size: 14px;
            text-transform: uppercase;
        }

        input[type="number"], input[type="text"] {
            width: 55%;
            padding: 10px 12px;
            background-color: #0f172a;
            border: 1px solid #334155;
            color: #fff;
            border-radius: 6px;
            font-family: 'Fira Code', monospace;
            font-size: 15px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        input[type="number"]::placeholder, input[type="text"]::placeholder {
            color: #475569;
        }

        input[type="number"]:focus, input[type="text"]:focus {
            border-color: #06b6d4;
            outline: none;
            box-shadow: 0 0 12px rgba(6, 182, 212, 0.4);
            background-color: #1e293b;
        }

        .error-message {
            color: #fca5a5;
            background-color: rgba(127, 29, 29, 0.5);
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 13px;
            display: none;
            border: 1px solid #ef4444;
            text-align: center;
            animation: pulseError 2s infinite;
        }

        @keyframes pulseError {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        button.main-btn {
            background: linear-gradient(90deg, #0284c7, #0891b2);
            color: white;
            border: none;
            padding: 14px 24px;
            font-family: 'Fira Code', monospace;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(8, 145, 178, 0.3);
            position: relative;
            z-index: 10;
        }

        button.main-btn:hover {
            background: linear-gradient(90deg, #0369a1, #0e7490);
            box-shadow: 0 6px 20px rgba(8, 145, 178, 0.5);
            transform: translateY(-2px);
        }

        #result-area {
            margin-top: 30px;
            padding: 25px 20px;
            border-radius: 8px;
            display: none;
            animation: fadeInDown 0.5s ease forwards;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .calc-details {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 12px;
        }

        .final-score {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        /* Success Theme */
        .success {
            background-color: rgba(6, 78, 59, 0.3);
            border: 1px solid #10b981;
        }
        
        .success .final-score {
            color: #34d399;
            text-shadow: 0 0 10px rgba(52, 211, 153, 0.5);
        }

        .instruction-box {
            margin-top: 15px;
            padding: 15px;
            background-color: rgba(0, 0, 0, 0.5);
            border: 1px dashed #34d399;
            border-radius: 6px;
            font-size: 15px;
            color: #a7f3d0;
            line-height: 1.5;
        }

        .instruction-box b {
            color: #fff;
            text-transform: uppercase;
        }

        /* Fail Theme */
        .fail {
            background-color: rgba(127, 29, 29, 0.3);
            border: 1px solid #ef4444;
        }

        .fail .final-score {
            color: #f87171;
            text-shadow: 0 0 10px rgba(248, 113, 113, 0.5);
        }

        .try-again {
            font-weight: normal;
            font-size: 14px;
            color: #fca5a5;
            line-height: 1.6;
        }

        button.reset-btn {
            background-color: transparent;
            color: #94a3b8;
            border: 1px solid #475569;
            margin-top: 25px;
            font-family: 'Fira Code', monospace;
            font-size: 13px;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        button.reset-btn:hover {
            background-color: #1e293b;
            color: #fff;
            border-color: #cbd5e1;
        }
        
        hr {
            border: none;
            border-top: 1px dashed #334155;
            margin: 20px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>[ HỆ THỐNG MSC ]</h1>
    <h2>TRẠM 2: KHÔNG GIAN SỐ HÓA</h2>

    <div class="instructions">
        > Nhập điểm từ LMS Canvas của từng thành viên (0 - 20).<br>
        > Bỏ trống nếu nhóm có ít hơn 6 người.<br>
        > Hệ thống sẽ tự động tổng hợp và tính điểm trung bình.
    </div>

    <div id="error-message" class="error-message"></div>

    <div id="info-container" style="position: relative; z-index: 10;">
        <div class="input-group">
            <label for="teamName">> Mã Đội:</label>
            <input type="text" id="teamName" placeholder="VD: Nhóm 1...">
        </div>
        <div class="input-group">
            <label for="className">> Phân Khu (Lớp):</label>
            <input type="text" id="className" placeholder="VD: 6A1...">
        </div>
    </div>
    
    <hr>

    <div id="inputs-container">
        <div class="input-group">
            <label for="score1">Đặc vụ 01:</label>
            <input type="number" id="score1" min="0" max="20" placeholder="Điểm..." step="any">
        </div>
        <div class="input-group">
            <label for="score2">Đặc vụ 02:</label>
            <input type="number" id="score2" min="0" max="20" placeholder="Điểm..." step="any">
        </div>
        <div class="input-group">
            <label for="score3">Đặc vụ 03:</label>
            <input type="number" id="score3" min="0" max="20" placeholder="Điểm..." step="any">
        </div>
        <div class="input-group">
            <label for="score4">Đặc vụ 04:</label>
            <input type="number" id="score4" min="0" max="20" placeholder="Điểm..." step="any">
        </div>
        <div class="input-group">
            <label for="score5">Đặc vụ 05:</label>
            <input type="number" id="score5" min="0" max="20" placeholder="Điểm..." step="any">
        </div>
        <div class="input-group">
            <label for="score6">Đặc vụ 06:</label>
            <input type="number" id="score6" min="0" max="20" placeholder="Điểm..." step="any">
        </div>
    </div>

    <button class="main-btn" onclick="calculateAverage()">[ TRÍCH XUẤT DỮ LIỆU ]</button>

    <div id="result-area">
        <div id="team-info-display" style="font-size: 16px; font-weight: bold; color: #38bdf8; margin-bottom: 10px; text-transform: uppercase;"></div>
        <div class="calc-details" id="calc-details"></div>
        <div class="final-score" id="final-score-text"></div>
        <div id="keyword-display"></div>
        <button class="reset-btn" onclick="resetForm()">[ KHỞI ĐỘNG LẠI HỆ THỐNG ]</button>
    </div>
</div>

<script>
    function calculateAverage() {
        const teamNameInput = document.getElementById('teamName');
        const classNameInput = document.getElementById('className');
        const inputsContainer = document.getElementById('inputs-container');
        const inputs = inputsContainer.querySelectorAll('input[type="number"]');
        const resultArea = document.getElementById('result-area');
        const teamInfoDisplay = document.getElementById('team-info-display');
        const calcDetails = document.getElementById('calc-details');
        const finalScoreText = document.getElementById('final-score-text');
        const keywordDisplay = document.getElementById('keyword-display');
        const errorMsg = document.getElementById('error-message');

        let totalScore = 0;
        let count = 0;
        let valid = true;

        // Reset trạng thái
        resultArea.style.display = 'none';
        resultArea.className = '';
        keywordDisplay.innerHTML = '';
        errorMsg.style.display = 'none';
        inputs.forEach(input => input.style.borderColor = '#334155');
        teamNameInput.style.borderColor = '#334155';
        classNameInput.style.borderColor = '#334155';

        const teamName = teamNameInput.value.trim();
        const className = classNameInput.value.trim();

        if (!teamName || !className) {
            errorMsg.innerText = "[LỖI] Yêu cầu nhập đầy đủ Mã Đội và Phân Khu.";
            errorMsg.style.display = 'block';
            if (!teamName) teamNameInput.style.borderColor = '#ef4444';
            if (!className) classNameInput.style.borderColor = '#ef4444';
            return;
        }

        // Duyệt qua các ô nhập liệu
        inputs.forEach((input, index) => {
            let value = input.value.trim();

            if (value !== "") {
                let score = parseFloat(value);

                // Kiểm tra tính hợp lệ của điểm
                if (isNaN(score) || score < 0 || score > 20) {
                    errorMsg.innerText = `[LỖI CÚ PHÁP] Điểm Đặc vụ 0${index + 1} không hợp lệ (0 - 20).`;
                    errorMsg.style.display = 'block';
                    input.style.borderColor = '#ef4444';
                    input.focus();
                    valid = false;
                    return; 
                }
                totalScore += score;
                count++;
            }
        });

        if (!valid) return; // Dừng nếu dữ liệu lỗi

        if (count === 0) {
            errorMsg.innerText = "[CẢNH BÁO] Không tìm thấy dữ liệu điểm. Yêu cầu nhập ít nhất 1 đặc vụ.";
            errorMsg.style.display = 'block';
            return;
        }

        // Tính trung bình
        let average = totalScore / count;
        // Làm tròn đến 1 chữ số thập phân
        let roundedAverage = Math.round(average * 10) / 10;

        // Hiển thị vùng kết quả
        resultArea.style.display = 'block';
        teamInfoDisplay.innerHTML = `ĐỘI: ${teamName} // LỚP: ${className}`;
        calcDetails.innerHTML = `Tổng điểm hệ thống: <span style="color:#fff">${totalScore}</span> &nbsp;|&nbsp; Số lượng đặc vụ: <span style="color:#fff">${count}</span>`;
        finalScoreText.innerHTML = `ĐIỂM TRUNG BÌNH: ${roundedAverage.toFixed(1)}`;

        // Kiểm tra điều kiện qua bài (ẨN TỪ KHÓA ĐI)
        if (roundedAverage >= 10) {
            resultArea.classList.add('success');
            keywordDisplay.innerHTML = `
                <div style="font-size: 20px; font-weight: bold; margin-bottom: 10px;">[ BẺ KHÓA THÀNH CÔNG ]</div>
                <div class="instruction-box">
                    Điều kiện vượt trạm đã được xác nhận.<br><br>
                    Yêu cầu mang thiết bị hiển thị màn hình này đến gặp <b>Trạm trưởng</b> để nhận <b>Mảnh Ghép Bí Mật</b>!
                </div>
            `;
        } else {
            resultArea.classList.add('fail');
            keywordDisplay.innerHTML = `
                <div style="font-size: 20px; font-weight: bold; margin-bottom: 10px; color: #f87171;">[ TRUY CẬP BỊ TỪ CHỐI ]</div>
                <div class="try-again">
                    Mức năng lượng trung bình không đạt yêu cầu (Dưới 10).<br>
                    Hệ thống từ chối cấp quyền vượt trạm. Hãy cố gắng ở lần sau!
                </div>
            `;
        }
    }

    function resetForm() {
        // Xóa sạch các ô nhập
        const inputs = document.querySelectorAll('input[type="number"], input[type="text"]');
        inputs.forEach(input => {
            input.value = '';
            input.style.borderColor = '#334155';
        });

        // Ẩn vùng kết quả & lỗi
        const resultArea = document.getElementById('result-area');
        const errorMsg = document.getElementById('error-message');
        
        resultArea.style.display = 'none';
        resultArea.className = '';
        errorMsg.style.display = 'none';
        
        // Focus lại vào ô đầu tiên
        document.getElementById('teamName').focus();
    }
</script>

</body>
</html>
